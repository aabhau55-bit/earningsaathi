<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Opening PrizeUp…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        background: #0a1410;
        color: #fff;
        text-align: center;
      }
      .box { padding: 24px; }
      .code { font-weight: 800; letter-spacing: 2px; color: #4ade80; }
      a { color: #4ade80; }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Opening PrizeUp…</h2>
      <p id="msg">Redirecting…</p>
    </div>
    <!--
      Served for /i/<code> via the .htaccess rewrite (the browser URL stays
      /i/<code>, so we can read the code from the path here). Opens the app if
      installed, else falls back to the Play Store carrying the code so a new
      user still gets it auto-applied after install.
    -->
    <script>
      (function () {
        var PACKAGE = 'com.earningsaathi.prizeup';
        var HOST = 'earningsaathi.com';
        var m = location.pathname.match(/\/i\/([A-Za-z0-9]+)/i);
        var code = m ? m[1].toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 16) : '';
        var play =
          'https://play.google.com/store/apps/details?id=' + PACKAGE +
          (code ? '&referrer=' + encodeURIComponent('ref=' + code) : '');
        var intent =
          'intent://' + HOST + '/i/' + code + '#Intent;scheme=https;package=' + PACKAGE +
          ';S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
        document.getElementById('msg').innerHTML = code
          ? 'Invite code <span class="code">' + code +
            '</span><br>If nothing happens, <a href="' + play + '">get the app on Google Play</a>.'
          : '<a href="' + play + '">Get the app on Google Play</a>';
        try { window.location.replace(intent); } catch (e) {}
        setTimeout(function () { window.location.replace(play); }, 1500);
      })();
    </script>
  </body>
</html>
